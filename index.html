<!DOCTYPE html>
<html class="dark" lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Cổng Game Phép Biện Chứng: Sự Thay Đổi Vĩnh Cửu</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Epilogue:ital,wght@0,100..900;1,100..900&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#1fad96", // Teal
              "accent": "#B3EB26", // Legacy support
              "accent-lime": "#B3EB26", // New UI support
              "background-light": "#f2f2f3",
              "background-dark": "#111117",
              "surface-dark": "#1c222e",
              "surface-hover": "#273142",
              "card-light": "#ffffff",
              "card-dark": "#1C1B1F",
            },
            fontFamily: {
              "display": ["Epilogue", "sans-serif"],
              "body": ["Epilogue", "sans-serif"],
            },
            animation: {
                'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                'float': 'float 6s ease-in-out infinite',
                'flux': 'float 8s ease-in-out infinite',
            },
            keyframes: {
                float: {
                    '0%, 100%': { transform: 'translateY(0)' },
                    '50%': { transform: 'translateY(-10px)' },
                }
            },
            backgroundImage: {
              'hero-pattern': "linear-gradient(to bottom, rgba(17, 17, 23, 0.6), rgba(17, 17, 23, 1))",
            }
          },
        },
      }
    </script>
    <style>
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.1);
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255,255,255,0.2);
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #1fad96;
      }
      .glass-panel {
        background: rgba(17, 17, 23, 0.75);
        backdrop-filter: blur(16px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      .bg-grid-pattern {
        background-size: 40px 40px;
        background-image: linear-gradient(to right, rgba(31, 173, 150, 0.05) 1px, transparent 1px),
                          linear-gradient(to bottom, rgba(31, 173, 150, 0.05) 1px, transparent 1px);
      }
      @keyframes float {
        0% { transform: translateY(0px) rotate(0deg); opacity: 0.4; }
        50% { transform: translateY(-20px) rotate(2deg); opacity: 0.6; }
        100% { transform: translateY(0px) rotate(0deg); opacity: 0.4; }
      }
      .animate-flux {
        animation: float 8s ease-in-out infinite;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-white font-display overflow-x-hidden transition-colors duration-300">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
